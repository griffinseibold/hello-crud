# SQLite allows a single writer and the volume is ReadWriteOnce, so this
# application supports at most one replica. Scale between 0 and 1.
replicaCount: 1

image:
  repository: ghcr.io/griffinseibold/hello-crud
  tag: "0.4.0"
  pullPolicy: IfNotPresent

storage:
  size: 1Gi
  # Empty uses the cluster's default StorageClass.
  storageClassName: ""

# Labels applied to the release namespace so platform policies (such as the
# homelab Gateway's allowedRoutes namespace selector) can admit this
# application.
namespace:
  create: true
  labels:
    gateway.homelab/access: public

httpRoute:
  enabled: true
  # The route claims <chart name>.<domain> by default. Set hostnames to claim
  # explicit names instead, or set domain to "" (with hostnames empty) to
  # attach as the catch-all route for every hostname the Gateway serves.
  domain: localhost
  hostnames: []
  parentRef:
    name: homelab
    namespace: gateway-system
    sectionName: http

# The homelab's language model runs only while an application asks for it.
# Enabling this adds the homelab.local/llm: requested label to the Deployment,
# which tells the homelab to start the model while this app has replicas
# running and to stop it a few minutes after nothing requests it. It also
# passes url to the app as LLM_URL. Off by default so the sample app never
# keeps the GPU busy.
llm:
  enabled: false
  url: http://llama-server.llm.svc.cluster.local/v1

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
